name: iOS TestFlight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Sign, archive, and upload the build to TestFlight"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Simulator compatibility tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Create a compatible iPhone simulator
        run: |
          set -euo pipefail
          RUNTIME_ID="$(python3 .github/scripts/select_ios_simulator_runtime.py)"
          SIMULATOR_NAME="Tower-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SIMULATOR_ID="$(xcrun simctl create "$SIMULATOR_NAME" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$RUNTIME_ID")"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          {
            echo "SIMULATOR_ID=$SIMULATOR_ID"
            echo "SIMULATOR_RUNTIME=$RUNTIME_ID"
          } >> "$GITHUB_ENV"

      - name: Run iPhone simulator tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Tower.xcodeproj \
            -scheme Tower \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/TowerTests.xcresult" \
            | xcbeautify

      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tower-simulator-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/TowerTests.xcresult
          retention-days: 14
          if-no-files-found: warn

      - name: Remove CI simulator
        if: always()
        run: |
          if [ -n "${SIMULATOR_ID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_ID" || true
            xcrun simctl delete "$SIMULATOR_ID" || true
          fi

  testflight:
    name: Sign and upload TestFlight build
    needs: test
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: macos-26
    timeout-minutes: 40
    environment: testflight

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Install signing certificate and App Store profile
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APP_STORE_PROVISIONING_PROFILE_BASE64 \
            KEYCHAIN_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "Required signing secret $variable is not available."
              exit 1
            fi
          done

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/AppStore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/AppStore.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$PROFILE_PLIST")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PROFILE_PLIST")
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c "Print Entitlements:get-task-allow" "$PROFILE_PLIST")

          if [ "$APP_IDENTIFIER" != "$TEAM_ID.com.jzb.tower" ] || [ "$GET_TASK_ALLOW" != "false" ]; then
            echo "The provisioning profile must be an App Store profile for com.jzb.tower."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print ProvisionedDevices" "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "An Ad Hoc or Development provisioning profile cannot be used for TestFlight."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "TEAM_ID=$TEAM_ID"
            echo "PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_ENV"

      - name: Archive signed Release build
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          ARCHIVE_PATH="$RUNNER_TEMP/Tower.xcarchive"

          xcodebuild archive \
            -project Tower.xcodeproj \
            -scheme Tower \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          EXPORT_PATH="$RUNNER_TEMP/export"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.jzb.tower</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            | xcbeautify

          IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload signed IPA as a temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tower-TestFlight-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload build to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for variable in \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64; do
            if [ -z "${!variable:-}" ]; then
              echo "Required App Store Connect secret $variable is not available."
              exit 1
            fi
          done

          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIRECTORY"
          echo -n "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 --decode > "$API_KEY_DIRECTORY/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          chmod 600 "$API_KEY_DIRECTORY/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --output-format json

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
          rm -rf "$HOME/.appstoreconnect/private_keys" || true
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
